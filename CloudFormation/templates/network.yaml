AWSTemplateFormatVersion: '2010-09-09'
Description: Red exclusiva de Globomatics CloudFormation.

Parameters:
  VpcCidr:
    Description: CIDR de la VPC CloudFormation
    Type: String
    Default: 10.70.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  SubnetCidr:
    Description: CIDR de la subred publica
    Type: String
    Default: 10.70.1.0/24
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  SSHLocation:
    Description: CIDR autorizado para SSH
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: globomatics-cf-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: globomatics-cf-igw

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref SubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: globomatics-cf-public-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: globomatics-cf-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: frontend-cf-sg
      GroupDescription: Acceso publico al frontend CloudFormation
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: SSH de administracion
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
        - Description: HTTP publico
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTPS publico
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Salida para actualizaciones y dependencias
          IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: frontend-cf-sg

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: backend-cf-sg
      GroupDescription: Acceso privado al backend CloudFormation
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: SSH de administracion
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
      SecurityGroupEgress:
        - Description: Salida para actualizaciones y dependencias
          IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: backend-cf-sg

  FrontendToBackendApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: API desde el frontend CloudFormation
      GroupId: !Ref BackendSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref FrontendSecurityGroup

Outputs:
  VpcId:
    Description: ID de la VPC CloudFormation
    Value: !Ref Vpc
  PublicSubnetId:
    Description: ID de la subred publica
    Value: !Ref PublicSubnet
  FrontendSecurityGroupId:
    Description: Security Group del frontend
    Value: !Ref FrontendSecurityGroup
  BackendSecurityGroupId:
    Description: Security Group del backend
    Value: !Ref BackendSecurityGroup
