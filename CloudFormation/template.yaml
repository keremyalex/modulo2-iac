AWSTemplateFormatVersion: '2010-09-09'
Description: Globomatics CF - orquesta red, backend y frontend mediante stacks anidados.

Parameters:
  KeyName:
    Description: Key Pair existente en AWS para acceder por SSH
    Type: AWS::EC2::KeyPair::KeyName
    Default: pk-lab2-ecommerce
  SSHLocation:
    Description: CIDR autorizado para SSH
    Type: String
    Default: 158.172.226.238/32
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Debe tener formato CIDR, por ejemplo 203.0.113.10/32
  BackendInstanceType:
    Description: Tipo de instancia EC2 para el backend
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  FrontendInstanceType:
    Description: Tipo de instancia EC2 para el frontend
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  RepositoryUrl:
    Description: Repositorio HTTPS que clonara cloud-init
    Type: String
    Default: https://github.com/keremyalex/modulo2-iac.git
    AllowedPattern: '^https://.*$'
  RepositoryBranch:
    Description: Rama del repositorio que se desplegara
    Type: String
    Default: practico07
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
  DatabaseParameterName:
    Description: Nombre del SecureString existente en Parameter Store
    Type: String
    Default: /globomatics/cf/database/password
    AllowedPattern: '^/[A-Za-z0-9_.\-/]+$'

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./templates/network.yaml
      Parameters:
        SSHLocation: !Ref SSHLocation
      Tags:
        - Key: Project
          Value: globomatic
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Variant
          Value: cf

  BackendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./templates/backend.yaml
      Parameters:
        KeyName: !Ref KeyName
        InstanceType: !Ref BackendInstanceType
        SubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
        SecurityGroupId: !GetAtt NetworkStack.Outputs.BackendSecurityGroupId
        DatabaseParameterName: !Ref DatabaseParameterName
        RepositoryUrl: !Ref RepositoryUrl
        RepositoryBranch: !Ref RepositoryBranch
      Tags:
        - Key: Project
          Value: globomatic
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Variant
          Value: cf

  FrontendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./templates/frontend.yaml
      Parameters:
        KeyName: !Ref KeyName
        InstanceType: !Ref FrontendInstanceType
        SubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
        SecurityGroupId: !GetAtt NetworkStack.Outputs.FrontendSecurityGroupId
        BackendPrivateIp: !GetAtt BackendStack.Outputs.PrivateIp
        RepositoryUrl: !Ref RepositoryUrl
        RepositoryBranch: !Ref RepositoryBranch
      Tags:
        - Key: Project
          Value: globomatic
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Variant
          Value: cf

Outputs:
  VpcId:
    Description: VPC exclusiva del despliegue CloudFormation
    Value: !GetAtt NetworkStack.Outputs.VpcId
  BackendInstanceId:
    Description: ID de la EC2 backend
    Value: !GetAtt BackendStack.Outputs.InstanceId
  BackendPublicIp:
    Description: IP publica del backend
    Value: !GetAtt BackendStack.Outputs.PublicIp
  BackendPrivateIp:
    Description: IP privada usada por Nginx
    Value: !GetAtt BackendStack.Outputs.PrivateIp
  FrontendInstanceId:
    Description: ID de la EC2 frontend
    Value: !GetAtt FrontendStack.Outputs.InstanceId
  FrontendPublicIp:
    Description: IP publica del frontend
    Value: !GetAtt FrontendStack.Outputs.PublicIp
  ApplicationUrl:
    Description: URL publica de Globomatics CloudFormation
    Value: !Sub
      - http://${FrontendIp}
      - FrontendIp: !GetAtt FrontendStack.Outputs.PublicIp
