AWSTemplateFormatVersion: '2010-09-09'
Description: Root template Globomatics - orquesta los stacks anidados de red, backend y frontend.

Parameters:
  KeyName:
    Description: Nombre del Key Pair existente en AWS para acceder por SSH
    Type: AWS::EC2::KeyPair::KeyName
    Default: llave-diplomado
  SSHLocation:
    Description: CIDR autorizado para acceso SSH (ej. 203.0.113.10/32)
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Debe ser un rango CIDR valido (ej. 203.0.113.10/32)
  InstanceType:
    Description: Tipo de instancia EC2 para Backend y Frontend
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./templates/network.yaml
      Parameters:
        SSHLocation: !Ref SSHLocation

  BackendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./templates/backend.yaml
      Parameters:
        KeyName: !Ref KeyName
        InstanceType: !Ref InstanceType
        SubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
        SecurityGroupId: !GetAtt NetworkStack.Outputs.WebSecurityGroupId

  FrontendStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./templates/frontend.yaml
      Parameters:
        KeyName: !Ref KeyName
        InstanceType: !Ref InstanceType
        SubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
        SecurityGroupId: !GetAtt NetworkStack.Outputs.WebSecurityGroupId

Outputs:
  VpcId:
    Description: ID de la VPC
    Value: !GetAtt NetworkStack.Outputs.VpcId
  BackendPublicIP:
    Description: IP Publica del servidor Backend
    Value: !GetAtt BackendStack.Outputs.PublicIp
  FrontendPublicIP:
    Description: IP Publica del servidor Frontend
    Value: !GetAtt FrontendStack.Outputs.PublicIp
  BackendInstanceId:
    Description: ID de la instancia Backend
    Value: !GetAtt BackendStack.Outputs.InstanceId
  FrontendInstanceId:
    Description: ID de la instancia Frontend
    Value: !GetAtt FrontendStack.Outputs.InstanceId
