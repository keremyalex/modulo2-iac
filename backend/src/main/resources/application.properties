# Configuracion del Servidor
server.port=8080
server.servlet.context-path=/

# Configuracion de Conexion a Base de Datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/asistenciadiplomado}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:globomatics_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuracion de Carga de Archivos Excel
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Formato JSON y Fechas
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/La_Paz
